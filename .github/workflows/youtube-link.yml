name: Get YouTube Direct Link

on:
  workflow_dispatch:
    inputs:
      input:
        description: 'Format: URL,QUALITY (example: https://www.youtube.com/watch?v=xxx,720) — enter 11 to clear link.txt'
        required: true
        type: string

permissions:
  contents: write

jobs:
  get-link:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Required by modern yt-dlp YouTube extraction
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Install yt-dlp with its default dependencies, including EJS
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade "yt-dlp[default]"

      - name: Build proxy URL
        env:
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote

          host = os.environ["PROXY_HOST"]
          port = os.environ["PROXY_PORT"]
          user = quote(os.environ["PROXY_USER"], safe="")
          password = quote(os.environ["PROXY_PASS"], safe="")

          proxy = f"socks5h://{user}:{password}@{host}:{port}"

          print("::add-mask::" + os.environ["PROXY_USER"])
          print("::add-mask::" + os.environ["PROXY_PASS"])
          print("::add-mask::" + proxy)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PROXY_URL={proxy}\n")
          PY

      - name: Process input and update link.txt
        env:
          RAW_INPUT: ${{ inputs.input }}
        run: |
          set -euo pipefail

          # Always clear the previous link
          : > link.txt

          # Trim whitespace
          RAW_INPUT="$(printf '%s' "$RAW_INPUT" | xargs)"

          # 11 = clear link.txt only
          if [ "$RAW_INPUT" = "11" ]; then
            echo "Input is 11 — link.txt cleared."
            exit 0
          fi

          # Extract URL and quality
          URL="${RAW_INPUT%%,*}"

          if [[ "$RAW_INPUT" == *,* ]]; then
            QUALITY="${RAW_INPUT#*,}"
          else
            QUALITY="1080"
          fi

          URL="$(printf '%s' "$URL" | xargs)"
          QUALITY="$(printf '%s' "$QUALITY" | xargs | tr -d 'pP')"

          if [ -z "$URL" ]; then
            echo "ERROR: YouTube URL is empty."
            exit 1
          fi

          # Default quality
          if [ -z "$QUALITY" ]; then
            QUALITY="1080"
          fi

          # Validate quality
          if ! [[ "$QUALITY" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid quality: $QUALITY"
            exit 1
          fi

          echo "URL: $URL"
          echo "Requested quality: ${QUALITY}p"

          # Get one direct URL with video + audio.
          #
          # best[height<=Q]
          #   = best single-file format at or below requested quality
          #
          # /best
          #   = fallback when no matching format exists
          #
          # socks5h makes DNS resolution happen through the SOCKS proxy.
          DIRECT_LINK="$(
            yt-dlp \
              --proxy "$PROXY_URL" \
              --no-warnings \
              --no-playlist \
              --format "best[height<=${QUALITY}]/best" \
              --get-url \
              "$URL"
          )"

          # Remove possible blank lines
          DIRECT_LINK="$(printf '%s\n' "$DIRECT_LINK" | sed '/^[[:space:]]*$/d' | head -n1)"

          if [ -z "$DIRECT_LINK" ]; then
            echo "ERROR: Failed to extract direct link."
            exit 1
          fi

          # Save only the direct media URL
          printf '%s\n' "$DIRECT_LINK" > link.txt

          echo "Direct link successfully extracted."
          echo "Saved to link.txt"

      - name: Commit and push link.txt
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add link.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update YouTube direct link"
          git push
